
name: CI

on:
  push:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '12.6.0'

      - name: Set up Make
        run: sudo apt-get update && sudo apt-get install -y make

      - name: Install dependencies
        run: make setup

      - name: Run linter
        run: make lint

      - name: Run tests
        run: make test
